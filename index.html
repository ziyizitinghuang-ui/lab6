<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pack for the Weather</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>

  <header>
    <h1>Pack for the Weather</h1>
  </header>

  <main>
    <section class="search-panel">
      <h2>Where to?</h2>
      <p>Enter a city to check the weather.</p>

      <form id="weather-form">
        <input
          type="text"
          id="city-input"
          placeholder="e.g. London, Tokyo, Toronto"
          required
        >
        <button type="submit">Pack My Bag</button>
      </form>

      <p id="status" aria-live="polite"></p>

      <div id="weather-info" class="weather-info hidden">
        <p class="small-label">YOUR DESTINATION</p>
        <h3 id="city-name">Destination</h3>
        <p class="temperature" id="temperature"></p>
        <p id="weather-description"></p>
      </div>
    </section>

    <section class="suitcase-panel">
      <h2>Your Suitcase</h2>
      <p>Here's what to pack.</p>

      <div class="suitcase">
        <img
          src="images/suitcase.png"
          alt="An open suitcase"
          class="suitcase-image"
        >

        <div class="packing-area">
          <img
            id="packed-combination"
            src="images/03_cool_weather.png"
            alt="Packed clothing"
            class="hidden"
          >
        </div>
      </div>
    </section>

    <section class="packing-panel">
      <h2>Packing List</h2>
      <p>What you'll need for your trip.</p>

      <ul id="packing-list">
        <li>Enter a city to see your packing list.</li>
      </ul>
    </section>
  </main>

  <footer>
    <p>Weather data from Open-Meteo</p>
  </footer>

</body>
</html>
